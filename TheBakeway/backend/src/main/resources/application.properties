spring.application.name=TheBakeway

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Replace accounts, bakeries and menus with config/initialAccounts.txt and config/initialCity.txt at startup,
# and clear orders and events (UC-REG-03, UC-ORD-01). Set to false to keep the current data.
bakeway.load-initial-state=true