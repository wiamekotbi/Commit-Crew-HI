<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bakeway - Order Summary</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="dashboard-page">
    <header class="dashboard-header">
        <h1>
            <span class="brand-icon"><i class="fa-solid fa-bread-slice"></i></span>
            <span class="brand-name">The Bakeway</span>
        </h1>
        <div class="user-box">
            <span id="userName"><i class="fa-solid fa-circle-user"></i></span>
            <span id="userRole" class="role-chip"></span>
            <a href="/dashboard.html" class="header-link"><i class="fa-solid fa-gauge"></i> My orders</a>
            <a href="/profile.html" class="header-link"><i class="fa-solid fa-id-card"></i> Profile</a>
            <button type="button" id="logoutButton" class="header-link">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </header>
    <main class="dashboard-main">
        <div class="panel">
            <section class="card">
                <div class="card-title">
                    <h2><i class="fa-solid fa-receipt"></i> Order summary</h2>
                    <button type="button" class="btn secondary" id="retrySummary">
                        <i class="fa-solid fa-rotate"></i> Refresh
                    </button>
                </div>
                <div id="orderSummary" aria-live="polite" aria-busy="true">
                    <p class="muted">Loading order summary...</p>
                </div>
            </section>
        </div>
    </main>
    <script src="/js/dashboard.js"></script>
    <script src="/js/order-summary.js"></script>
</body>
</html>
