<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bakeway - Profile</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <header>
        <h1>
    <span class="brand-icon">
        <i class="fa-solid fa-bread-slice"></i>
    </span>
    <span class="brand-name">The Bakeway</span>
</h1>

    </header>

    <main>
        <div class="registration-card">
            <h2>My Profile</h2>

            <form id="profileForm">
                <label for="accountId">Account ID</label>
                <input type="text" id="accountId" readonly>

                <label for="username">Username</label>
                <input type="text" id="username" readonly>

                <label for="role">Role</label>
                <input type="text" id="role" readonly>

                <label for="displayName">Display Name</label>
                <input type="text" id="displayName" required>

                <label for="contactEmail">Contact Email</label>
                <input type="email" id="contactEmail">

                <label for="deliveryAddress">Delivery Address</label>
                <input type="text" id="deliveryAddress">

                <button type="submit">Save Changes</button>
            </form>

            <button type="button" id="logoutButton" class="secondary-button">Logout</button>
            <p id="message"></p>
        </div>
    </main>

    <script src="/js/profile.js"></script>
</body>
</html>
