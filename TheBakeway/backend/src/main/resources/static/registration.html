<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bakeway - Register</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="bakery-background">
        <span class="icon icon1">🥐</span>
        <span class="icon icon2">🍞</span>
        <span class="icon icon3">🍪</span>
        <span class="icon icon4">🥖</span>
        <span class="icon icon5">🍰</span>
        <span class="icon icon6">🥨</span>
    </div>

    <header>
        <h1><span class="brand-icon">🥐</span> <span class="brand-name">The Bakeway</span></h1>
        <p>Freshly baked, just a click away</p>
    </header>

    <main>
        <div class="registration-card">
            <div class="card-icon">🍞</div>

            <h2>Create a Customer Account</h2>

            <form id="registrationForm">
                <label for="name">Name</label>
                <input type="text" id="name" required>

                <label for="username">Username</label>
                <input type="text" id="username" required>

                <label for="password">Password</label>
                <input type="password" id="password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required>

                <label for="deliveryAddress">Delivery Address</label>
                <input type="text" id="deliveryAddress" required>

                <button type="submit">Create Customer Account</button>
            </form>

            <p id="message"></p>
        </div>
    </main>

    <script src="/js/registration.js"></script>
</body>
</html>
