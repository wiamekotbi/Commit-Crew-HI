services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thebakeway
      POSTGRES_USER: thebakeway
      POSTGRES_PASSWORD: thebakeway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thebakeway -d thebakeway"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - thebakeway-data:/var/lib/postgresql/data

  app:
    build:
      context: ./TheBakeway/backend
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://database:5432/thebakeway
      SUPABASE_DB_USERNAME: thebakeway
      SUPABASE_DB_PASSWORD: thebakeway
      # Google Maps browser key, taken from your shell; never write it here
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  thebakeway-data:
